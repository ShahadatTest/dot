name: Bug report
description: Something isn't working right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Now Playing
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone and Android version
      placeholder: Nothing Phone (4a), Android 16
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Dot version
      placeholder: 1.0.0
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Anything else that helps, such as a screen recording.
